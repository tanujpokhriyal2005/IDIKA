name: fieldproof

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: fieldproof
      POSTGRES_PASSWORD: fieldproof
      POSTGRES_DB: fieldproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldproof -d fieldproof"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fieldproof:fieldproof@db:5432/fieldproof?sslmode=disable
      DEV_MODE: "true"        # OTP is returned to the app until an SMS gateway is added
      SEED_DEMO: "true"
      ADMIN_USER: admin
      ADMIN_PASSWORD: fieldproof
      WEB_DIR: /web           # dashboard files straight from the repo, so edits show on reload
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
      - ./backend/internal/api/web:/web:ro
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
